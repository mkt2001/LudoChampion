<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Champ - Traditional & Modern Board Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-classic">

    <header class="game-header">
        <div class="logo-container">
            <div class="champ-logo">
                <i class="fa-solid fa-crown logo-crown"></i>
                <span class="logo-text">LUDO <span class="highlight">CHAMP</span></span>
            </div>
        </div>
        
        <div class="controls-bar">
            <div class="mode-selector">
                <button id="btn-mode-ludo" class="mode-btn active" onclick="switchGameMode('ludo')">
                    <i class="fa-solid fa-dice"></i> Ludo
                </button>
                <button id="btn-mode-kaudi" class="mode-btn" onclick="switchGameMode('kaudi')">
                    <i class="fa-solid fa-shell"></i> Kaudi
                </button>
            </div>

            <div class="theme-selector">
                <select id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="theme-classic">Classic Wood</option>
                    <option value="theme-neon">Neon Cyber</option>
                    <option value="theme-royal">Royal Gold</option>
                </select>
            </div>
            
            <button class="sound-btn" id="soundToggle" onclick="toggleSound()">
                <i class="fa-solid fa-volume-high" id="soundIcon"></i>
            </button>
        </div>
    </header>

    <main class="game-container">
        <div class="board-wrapper">
            <!-- LUDO BOARD -->
            <div id="ludoBoard" class="board ludo-board">
                <!-- Bases -->
                <div class="base red-base">
                    <div class="base-inner">
                        <div class="token-spot" onclick="handleTokenClick('red', 0)"><div class="token red-token" id="red-0"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('red', 1)"><div class="token red-token" id="red-1"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('red', 2)"><div class="token red-token" id="red-2"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('red', 3)"><div class="token red-token" id="red-3"></div></div>
                    </div>
                </div>
                <div class="base green-base">
                    <div class="base-inner">
                        <div class="token-spot" onclick="handleTokenClick('green', 0)"><div class="token green-token" id="green-0"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('green', 1)"><div class="token green-token" id="green-1"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('green', 2)"><div class="token green-token" id="green-2"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('green', 3)"><div class="token green-token" id="green-3"></div></div>
                    </div>
                </div>
                <div class="base yellow-base">
                    <div class="base-inner">
                        <div class="token-spot" onclick="handleTokenClick('yellow', 0)"><div class="token yellow-token" id="yellow-0"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('yellow', 1)"><div class="token yellow-token" id="yellow-1"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('yellow', 2)"><div class="token yellow-token" id="yellow-2"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('yellow', 3)"><div class="token yellow-token" id="yellow-3"></div></div>
                    </div>
                </div>
                <div class="base blue-base">
                    <div class="base-inner">
                        <div class="token-spot" onclick="handleTokenClick('blue', 0)"><div class="token blue-token" id="blue-0"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('blue', 1)"><div class="token blue-token" id="blue-1"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('blue', 2)"><div class="token blue-token" id="blue-2"></div></div>
                        <div class="token-spot" onclick="handleTokenClick('blue', 3)"><div class="token blue-token" id="blue-3"></div></div>
                    </div>
                </div>

                <!-- Path Tracks Cells (Generated via CSS Grid & HTML) -->
                <div class="track-path">
                    <!-- Center Home Trophy -->
                    <div class="center-home">
                        <i class="fa-solid fa-trophy trophy-icon"></i>
                    </div>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="action-area">
                <div id="diceContainer" class="dice-container" onclick="rollDice()">
                    <div id="dice" class="dice">
                        <div class="dot center"></div>
                    </div>
                    <span id="turnIndicatorText" class="action-text">Red's Turn - Tap Dice</span>
                </div>

                <div id="kaudiContainer" class="kaudi-container hidden" onclick="throwKaudi()">
                    <div class="kaudi-shells">
                        <div class="kaudi-shell">🐚</div>
                        <div class="kaudi-shell">🐚</div>
                        <div class="kaudi-shell">🐚</div>
                        <div class="kaudi-shell">🐚</div>
                    </div>
                    <span class="action-text">Tap to Throw Kaudi</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
